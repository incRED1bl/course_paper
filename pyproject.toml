[tool.poetry]
name = "course-paper"
version = "0.1.0"
description = "Entropy and complexity analysis of time series data"
authors = ["Timur Toktamysov <timur.toktamysov@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
numpy = "^2.4.0"
scipy = "^1.17.0"
matplotlib = "^3.9.0"
ipykernel = "^6.29.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
